<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!--APP-->
<title>ราคากลางงานพิมพ์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style id="app-style">
/* เลย์เอาต์: ฟอร์มซ้าย ราคาขวา (จอใหญ่) / ฟอร์มบน ราคาค้างล่างจอ (มือถือ) — สีเขียวป่า + ส้ม ตามใบเรทร้าน */
:root {
  --bg: #f4f6f0; --card: #ffffff; --text: #1d2617; --muted: #5d6955; --line: #dde3d5;
  --brand: #2b5a1c; --brand-ink: #ffffff; --accent: #d9692a; --accent-soft: #fdeee2;
  --sel: #e6f0dc; --danger: #c0392b; --danger-soft: #fdecea; --input: #ffffff;
  --font-display: "Mitr", "Sarabun", "Noto Sans Thai", Tahoma, sans-serif;
  --font-body: "Sarabun", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11160e; --card: #1a2215; --text: #e4ead9; --muted: #9ba790; --line: #2f3b28;
    --brand: #1f3d15; --brand-ink: #eef4e6; --accent: #f39a5d; --accent-soft: #3a2415;
    --sel: #24371b; --danger: #ff8a80; --danger-soft: #3b1d1a; --input: #11160e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11160e; --card: #1a2215; --text: #e4ead9; --muted: #9ba790; --line: #2f3b28;
  --brand: #1f3d15; --brand-ink: #eef4e6; --accent: #f39a5d; --accent-soft: #3a2415;
  --sel: #24371b; --danger: #ff8a80; --danger-soft: #3b1d1a; --input: #11160e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--brand); color: var(--brand-ink);
  padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { min-width: 0; }
.brand small { display: block; font-size: 12px; opacity: .8; letter-spacing: .02em; }
.brand h1 { margin: 0; font: 500 18px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 4px; background: rgba(0,0,0,.18); border-radius: 999px; padding: 3px; flex-shrink: 0; }
.tabs button { border: 0; background: transparent; color: inherit; font: 600 15px var(--font-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tabs button.active { background: var(--card); color: var(--brand); }
:root[data-theme="dark"] .tabs button.active { color: var(--text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button.active { color: var(--text); } }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.layout { display: grid; gap: 16px; }
@media (min-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 420px); align-items: start; }
  .result-col { position: sticky; top: 80px; }
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h2 { font: 500 17px/1.3 var(--font-display); margin: 0 0 12px; }
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
.hint { color: var(--muted); font-size: 13px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  flex: 1 1 0; min-width: 72px; border: 1.5px solid var(--line); background: var(--input); color: var(--text);
  font: 600 15px var(--font-body); padding: 9px 10px; border-radius: 10px; cursor: pointer;
}
.seg button.active { border-color: var(--brand); background: var(--sel); }
:root[data-theme="dark"] .seg button.active { border-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.active { border-color: var(--accent); } }
.seg.wrap2 button { flex-basis: calc(50% - 6px); }
input[type=number], input[type=text], select, textarea {
  width: 100%; font: 16px var(--font-body); color: var(--text); background: var(--input);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px;
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hidden { display: none !important; }

.price-box { text-align: center; padding: 4px 0; }
.price-box .cap { color: var(--muted); font-size: 14px; }
.price-total { font: 600 44px/1.15 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.price-unit { font: 500 21px var(--font-display); margin-top: 2px; }
.rate-stamp { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
.warns:not(:empty) { margin-top: 12px; }
.warn { color: var(--danger); background: var(--danger-soft); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
table.detail { width: 100%; border-collapse: collapse; font-size: 15px; }
table.detail td { padding: 6px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
table.detail td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
table.detail tr.sum td { font-weight: 700; border-bottom: 1px solid var(--line); }
table.detail tr.info td { color: var(--muted); font-size: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0;
  background: var(--brand); color: var(--brand-ink); font: 700 15px var(--font-body);
  padding: 11px 16px; border-radius: 10px; cursor: pointer;
}
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
.btn.small { padding: 6px 10px; font-size: 14px; }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid var(--line); }
.btn.accent { background: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.quote-preview { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 10px; font-size: 14px; margin: 10px 0 0; }
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; text-align: center;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.mobile-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--card); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 -4px 14px rgba(0,0,0,.08);
}
.mobile-bar .t { font: 600 24px/1.1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.mobile-bar .u { font-size: 13px; color: var(--muted); }
@media (min-width: 860px) { .mobile-bar { display: none; } }
@media (max-width: 859px) { body.with-bar main { padding-bottom: 96px; } }

/* ตั้งค่า */
.set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.rates { border-collapse: collapse; width: 100%; min-width: 420px; font-size: 14px; }
table.rates th, table.rates td { border: 1px solid var(--line); padding: 4px; text-align: center; }
table.rates th { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
table.rates input { padding: 6px 4px; text-align: center; font-size: 15px; min-width: 56px; }
table.rates td.del { width: 1%; border: 0; padding-left: 6px; }
.paper-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.save-bar {
  position: sticky; bottom: 0; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
  box-shadow: 0 -4px 14px rgba(0,0,0,.08);
}
.save-bar .msg { font-weight: 600; font-size: 14px; }
.save-bar .msg.dirty { color: var(--accent); }
.save-bar .acts { display: flex; gap: 8px; }
</style>
<template id="app-markup">
<header class="top">
  <div class="brand"><small id="shopLabel"></small><h1>ราคากลางงานพิมพ์</h1></div>
  <nav class="tabs hidden" id="tabs">
    <button type="button" data-tab="calc" class="active">คำนวณ</button>
    <button type="button" data-tab="settings">ตั้งค่าเรท</button>
  </nav>
</header>
<main>
  <section id="view-calc">
    <div class="layout">
      <div>
        <div class="card">
          <div class="field">
            <span class="label">ประเภทงาน</span>
            <div class="seg" data-key="type">
              <button type="button" data-val="sheet">งานแผ่น</button>
              <button type="button" data-val="book">งานเข้าเล่ม</button>
            </div>
          </div>
          <div class="field">
            <span class="label">ขนาดชิ้นงาน</span>
            <div class="seg" data-key="size">
              <button type="button" data-val="A4">A4</button>
              <button type="button" data-val="A5">A5</button>
              <button type="button" data-val="A6">A6</button>
            </div>
          </div>
          <div class="field only-sheet">
            <label class="label" for="qty">จำนวน (ใบ)</label>
            <input type="number" id="qty" data-key="qty" min="1" step="1" inputmode="numeric" placeholder="เช่น 100">
          </div>
          <div class="row2 only-book field">
            <div>
              <label class="label" for="pages">หน้ารวมต่อเล่ม</label>
              <input type="number" id="pages" data-key="pages" min="1" step="1" inputmode="numeric" placeholder="รวมปก">
            </div>
            <div>
              <label class="label" for="books">จำนวนเล่ม</label>
              <input type="number" id="books" data-key="books" min="1" step="1" inputmode="numeric" placeholder="เช่น 20">
            </div>
          </div>
          <div class="field">
            <span class="label">พิมพ์สี</span>
            <div class="seg" data-key="sides">
              <button type="button" data-val="1">1 ด้าน</button>
              <button type="button" data-val="2">2 ด้าน</button>
            </div>
          </div>
          <div class="field">
            <label class="label" for="paperId"><span class="only-sheet">กระดาษ</span><span class="only-book">กระดาษเนื้อใน</span></label>
            <select id="paperId" data-key="paperId"></select>
          </div>
        </div>

        <div class="card only-book">
          <h2>เข้าเล่มและปก</h2>
          <div class="field">
            <span class="label">วิธีเข้าเล่ม</span>
            <div class="seg wrap2" data-key="binding">
              <button type="button" data-val="staple">เย็บแม็กมุม</button>
              <button type="button" data-val="saddle">เย็บมุงหลังคา</button>
              <button type="button" data-val="perfect">ไสกาว</button>
              <button type="button" data-val="ring">สันห่วง</button>
            </div>
          </div>
          <div class="field">
            <span class="label">ปก</span>
            <div class="seg" data-key="coverMode">
              <button type="button" data-val="same">กระดาษเดียวกับเนื้อใน</button>
              <button type="button" data-val="separate">กระดาษปกแยก</button>
            </div>
            <div class="hint" id="coverHint" style="margin-top:4px"></div>
          </div>
          <div class="field only-separate">
            <label class="label" for="coverPaperId">กระดาษปก</label>
            <select id="coverPaperId" data-key="coverPaperId"></select>
          </div>
          <div class="field only-separate">
            <span class="label">พิมพ์ปก</span>
            <div class="seg" data-key="coverSides">
              <button type="button" data-val="1">1 ด้าน</button>
              <button type="button" data-val="2">2 ด้าน</button>
            </div>
          </div>
          <div class="field">
            <span class="label">เคลือบปก</span>
            <div class="seg" data-key="laminate">
              <button type="button" data-val="none">ไม่เคลือบ</button>
              <button type="button" data-val="matte">เคลือบด้าน</button>
              <button type="button" data-val="gloss">เคลือบเงา</button>
            </div>
          </div>
        </div>
      </div>

      <div class="result-col">
        <div class="card">
          <div class="price-box">
            <div class="cap">ราคาขายรวม</div>
            <div class="price-total" id="outTotal">–</div>
            <div class="price-unit" id="outUnit"></div>
          </div>
          <div class="warns" id="warns"></div>
          <div class="rate-stamp" id="rateStamp"></div>
        </div>
        <div class="card">
          <h2>รายละเอียดราคา</h2>
          <table class="detail" id="detail"></table>
        </div>
        <div class="card">
          <button type="button" class="btn block accent" id="btnCopy">คัดลอกใบเสนอราคา</button>
          <div class="quote-preview" id="quotePreview"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="view-settings" class="hidden">
    <div class="card">
      <h2>กระดาษ</h2>
      <div class="hint" style="margin-bottom:10px">ชื่อกระดาษที่ใช้ทั้งงานแผ่นและงานเข้าเล่ม</div>
      <div id="paperList"></div>
      <button type="button" class="btn ghost small" id="btnAddPaper">+ เพิ่มกระดาษ</button>
    </div>

    <div class="card">
      <h2>เรทงานเข้าเล่ม (บาท / แผ่น A3)</h2>
      <div class="hint" style="margin-bottom:10px">ขั้นบันไดนับจากแผ่น A3 ทั้งงาน (เนื้อใน + ปก) ช่องว่าง = ยังไม่มีเรท</div>
      <div class="table-wrap"><table class="rates" id="bookTable"></table></div>
      <button type="button" class="btn ghost small" id="btnAddBookTier" style="margin-top:10px">+ เพิ่มช่วง</button>
    </div>

    <div class="card">
      <h2>เรทงานแผ่น (บาท / ใบ)</h2>
      <div class="hint" style="margin-bottom:10px">ขั้นบันไดนับจากจำนวนใบ จำนวนต่ำกว่าช่วงแรกใช้ราคาช่วงแรก ช่องว่าง = ยังไม่มีเรท</div>
      <div class="seg" id="sheetSizeSeg" style="margin-bottom:10px">
        <button type="button" data-val="A4">A4</button>
        <button type="button" data-val="A5">A5</button>
        <button type="button" data-val="A6">A6</button>
      </div>
      <div class="table-wrap"><table class="rates" id="sheetTable"></table></div>
      <button type="button" class="btn ghost small" id="btnAddSheetTier" style="margin-top:10px">+ เพิ่มช่วง</button>
    </div>

    <div class="card">
      <h2>เข้าเล่มและเคลือบ</h2>
      <div class="set-grid">
        <div><label class="label" for="s-bind-staple">เย็บแม็กมุม (บาท/เล่ม)</label><input type="number" min="0" step="any" inputmode="decimal" id="s-bind-staple" data-set="binding.staple"></div>
        <div><label class="label" for="s-bind-saddle">เย็บมุงหลังคา (บาท/เล่ม)</label><input type="number" min="0" step="any" inputmode="decimal" id="s-bind-saddle" data-set="binding.saddle"></div>
        <div><label class="label" for="s-bind-perfect">ไสกาว (บาท/เล่ม)</label><input type="number" min="0" step="any" inputmode="decimal" id="s-bind-perfect" data-set="binding.perfect"></div>
        <div><label class="label" for="s-bind-ring">สันห่วง (บาท/เล่ม)</label><input type="number" min="0" step="any" inputmode="decimal" id="s-bind-ring" data-set="binding.ring"></div>
        <div><label class="label" for="s-lam-matte">เคลือบด้าน (บาท/แผ่น A3)</label><input type="number" min="0" step="any" inputmode="decimal" id="s-lam-matte" data-set="laminate.matte"></div>
        <div><label class="label" for="s-lam-gloss">เคลือบเงา (บาท/แผ่น A3)</label><input type="number" min="0" step="any" inputmode="decimal" id="s-lam-gloss" data-set="laminate.gloss"></div>
      </div>
    </div>

    <div class="card">
      <h2>การวางงานบนแผ่น A3</h2>
      <div class="set-grid">
        <div><label class="label" for="s-per-A4">A4 ชิ้น/แผ่น</label><input type="number" min="1" step="1" id="s-per-A4" data-set="perSheet.A4"></div>
        <div><label class="label" for="s-per-A5">A5 ชิ้น/แผ่น</label><input type="number" min="1" step="1" id="s-per-A5" data-set="perSheet.A5"></div>
        <div><label class="label" for="s-per-A6">A6 ชิ้น/แผ่น</label><input type="number" min="1" step="1" id="s-per-A6" data-set="perSheet.A6"></div>
        <div><label class="label" for="s-cov-A4">A4 ปก/แผ่น</label><input type="number" min="1" step="1" id="s-cov-A4" data-set="coverPerSheet.A4"></div>
        <div><label class="label" for="s-cov-A5">A5 ปก/แผ่น</label><input type="number" min="1" step="1" id="s-cov-A5" data-set="coverPerSheet.A5"></div>
        <div><label class="label" for="s-cov-A6">A6 ปก/แผ่น</label><input type="number" min="1" step="1" id="s-cov-A6" data-set="coverPerSheet.A6"></div>
        <div><label class="label" for="s-waste">% เผื่อเสีย (งานเล่ม)</label><input type="number" min="0" step="any" id="s-waste" data-set="wastePct"></div>
      </div>
    </div>

    <div class="card">
      <h2>เงื่อนไขอื่น</h2>
      <div class="set-grid">
        <div><label class="label" for="s-minPrice">ราคาขั้นต่ำต่องาน (บาท)</label><input type="number" min="0" step="any" id="s-minPrice" data-set="minPrice"></div>
        <div><label class="label" for="s-saddleMax">มุงหลังคา สูงสุด (หน้า)</label><input type="number" min="1" step="1" id="s-saddleMax" data-set="saddleMaxPages"></div>
        <div><label class="label" for="s-ringMax">สันห่วง สูงสุด (แผ่น/เล่ม)</label><input type="number" min="1" step="1" id="s-ringMax" data-set="ringMaxSheets"></div>
        <div><label class="label" for="s-shopName">ชื่อร้านในใบเสนอราคา</label><input type="text" id="s-shopName" data-set="shopName" data-kind="text"></div>
        <div><label class="label" for="s-quoteNote">หมายเหตุท้ายใบเสนอราคา</label><input type="text" id="s-quoteNote" data-set="quoteNote" data-kind="text" placeholder="เช่น ยืนราคา 7 วัน"></div>
      </div>
    </div>

    <div class="save-bar">
      <span class="msg" id="saveMsg">ไม่มีการแก้ไข</span>
      <div class="acts">
        <button type="button" class="btn ghost small" id="btnDiscard">ยกเลิกการแก้ไข</button>
        <button type="button" class="btn small" id="btnSave">บันทึกเรท</button>
      </div>
    </div>
  </section>
</main>
<div class="mobile-bar" id="mobileBar">
  <div><div class="t" id="barTotal">–</div><div class="u" id="barUnit"></div></div>
  <button type="button" class="btn small accent" id="btnCopy2">คัดลอก</button>
</div>
<div class="toast" id="toast" role="status"></div>
</template>
<div id="app"></div>

<script id="app-script">
(function () {
  'use strict';

  // ---------- เรท (ฝังอยู่ในหน้า เจ้าของร้านบันทึกแล้วหน้าเว็บจะถูกเผยแพร่ใหม่) ----------
  var SIZES = ['A4', 'A5', 'A6'];

  // ค่าว่าง = ยังไม่มีเรท (null) แยกจาก 0
  function val(v) { if (v === '' || v == null) return null; var n = Number(v); return isFinite(n) ? n : null; }

  function normalize(s) {
    s.papers = s.papers || []; s.bookTiers = s.bookTiers || []; s.sheetTiers = s.sheetTiers || [];
    s.bookTiers.forEach(function (t) { t.r = t.r || {}; });

  }
  function paperById(s, id) {
    for (var i = 0; i < s.papers.length; i++) if (s.papers[i].id === id) return s.papers[i];
    return null;
  }
  function sortedTiers(list) { return list.slice().sort(function (a, b) { return (val(a.min) || 0) - (val(b.min) || 0); }); }
  // คืนช่วงที่ใช้ + ป้ายช่วง ("50–99")
  function pickTier(list, qty, unit) {
    var ts = sortedTiers(list);
    if (!ts.length) return null;
    var idx = 0;
    ts.forEach(function (t, i) { if (qty >= (val(t.min) || 0)) idx = i; });
    var lo = val(ts[idx].min) || 0, next = ts[idx + 1];
    var label = next ? fmt(lo) + '–' + fmt((val(next.min) || 0) - 1) + ' ' + unit : fmt(lo) + ' ' + unit + ' ขึ้นไป';
    return { tier: ts[idx], label: label, belowFirst: qty < lo };
  }
  function rateOf(map, paperId, sides) { var p = map && map[paperId]; return p ? val(p[sides - 1]) : null; }

  // ---------- คำนวณ ----------
  function calcSheet(f, s) {
    var r = { ok: false, warnings: [], isBook: false };

      r.warnings.push('ยังไม่มีเรทงานแผ่น ' + f.size + ' ' + paper.name + ' พิมพ์ ' + sides + ' ด้าน — แจ้งเจ้าของร้าน');
      return r;

    var per = Math.max(1, int(s.perSheet[f.size]) || 1);

    if (total < (val(s.minPrice) || 0)) { total = val(s.minPrice); minApplied = true; }
    return Object.assign(r, {
      ok: true, qty: qty, sides: sides, paper: paper, rate: rate, tierLabel: pick.label,
      a3: Math.ceil(qty / per), per: per, total: total, unit: total / qty, minApplied: minApplied

  }

  function calcBook(f, s) {
    var r = { ok: false, warnings: [], isBook: true };
    var pages = int(f.pages), books = int(f.books);
    if (!pages || !books) return r;
    var sides = f.sides === '1' ? 1 : 2;
    var separate = f.coverMode === 'separate';
    var coverSides = f.coverSides === '2' ? 2 : 1;
    var paper = paperById(s, f.paperId), coverPaper = separate ? paperById(s, f.coverPaperId) : null;
    if (!paper || (separate && !coverPaper)) { r.warnings.push('ยังไม่มีรายการกระดาษ'); return r; }
    var per = Math.max(1, int(s.perSheet[f.size]) || 1);
    var coverPer = Math.max(1, int(s.coverPerSheet[f.size]) || 1);
    var waste = val(s.wastePct) || 0;
    function addWaste(n) { return n > 0 ? ceilSafe(n * (1 + waste / 100)) : 0; }

    var innerPages = separate ? Math.max(pages - 4, 0) : pages;
    var sheetsPerBook = Math.ceil(innerPages / sides);
    var innerRaw = Math.ceil(sheetsPerBook * books / per);
    var coverRaw = separate ? Math.ceil(books / coverPer) : 0;
    var lamRaw = f.laminate !== 'none' ? Math.ceil(books / coverPer) : 0;

    var a3 = inner + cover;

    // เงื่อนไขการเข้าเล่ม (เตือนอย่างเดียว)
    if (separate && pages <= 4) r.warnings.push('ปกแยกนับเป็น 4 หน้า — หน้ารวม ' + pages + ' หน้า ไม่เหลือเนื้อใน');
    if (f.binding === 'saddle') {

      if (pages > int(s.saddleMaxPages)) r.warnings.push('เย็บมุงหลังคา: ไม่ควรเกิน ' + fmt(int(s.saddleMaxPages)) + ' หน้า (ตอนนี้ ' + fmt(pages) + ' หน้า)');

    }

    var pick = pickTier(s.bookTiers, a3, 'แผ่น A3');
    var rateInner = pick ? rateOf(pick.tier.r, paper.id, sides) : null;
    var rateCover = separate && pick ? rateOf(pick.tier.r, coverPaper.id, coverSides) : null;
    if (rateInner == null) { r.warnings.unshift('ยังไม่มีเรทงานเข้าเล่ม ' + paper.name + ' พิมพ์ ' + sides + ' ด้าน — แจ้งเจ้าของร้าน'); return r; }
    if (separate && rateCover == null) { r.warnings.unshift('ยังไม่มีเรทปก ' + coverPaper.name + ' พิมพ์ ' + coverSides + ' ด้าน — แจ้งเจ้าของร้าน'); return r; }

    var bindRate = val(s.binding[f.binding]);
    if (bindRate == null) r.warnings.push('ยังไม่ได้ตั้งราคา' + BINDING_NAMES[f.binding] + ' — ราคานี้ยังไม่รวมค่าเข้าเล่ม');
    var lamRate = f.laminate !== 'none' ? val(s.laminate[f.laminate]) : 0;
    if (lamRate == null) r.warnings.push('ยังไม่ได้ตั้งราคา' + LAMINATE_NAMES[f.laminate] + ' — ราคานี้ยังไม่รวมค่าเคลือบ');

      ok: true, pages: pages, books: books, qty: books, sides: sides, separate: separate, coverSides: coverSides,
      paper: paper, coverPaper: coverPaper, innerPages: innerPages, sheetsPerBook: sheetsPerBook, per: per, coverPer: coverPer,
      innerRaw: innerRaw, coverRaw: coverRaw, lamRaw: lamRaw, inner: inner, cover: cover, lam: lam, a3: a3,
      tierLabel: pick.label, rateInner: rateInner, rateCover: rateCover, bindRate: bindRate, lamRate: lamRate,

  }
  function calculate(f, s) { return f.type === 'book' ? calcBook(f, s) : calcSheet(f, s); }

  function quoteText(f, r) {

  // ---------- ตั้งค่าเรท (เฉพาะเจ้าของร้าน) ----------
  var sheetSize = 'A4';
  function isDirty() { return D && JSON.stringify(D) !== JSON.stringify(R); }
  function touch() {

    $('saveMsg').textContent = dirty ? 'มีการแก้ไขที่ยังไม่บันทึก' : 'ไม่มีการแก้ไข';
    $('saveMsg').classList.toggle('dirty', dirty);
    $('btnSave').disabled = !dirty; $('btnDiscard').disabled = !dirty;
  }
  function numInput(path, v) {
    return '<input type="number" min="0" step="any" inputmode="decimal" data-path="' + path + '" value="' + esc(v == null ? '' : v) + '">';
  }
  function tierTable(tiers, listName, minLabel, getMap, mapPath) {
    var h = '<thead><tr><th rowspan="2">' + minLabel + '</th>';
    D.papers.forEach(function (p) { h += '<th colspan="2">' + esc(p.name) + '</th>'; });
    h += '<th rowspan="2" class="del" style="background:transparent"></th></tr><tr>';
    D.papers.forEach(function () { h += '<th>1 ด้าน</th><th>2 ด้าน</th>'; });
    h += '</tr></thead><tbody>';
    tiers.forEach(function (t, i) {
      var map = getMap(t) || {};
      h += '<tr><td>' + numInput(listName + '.' + i + '.min', t.min) + '</td>';
      D.papers.forEach(function (p) {
        var pr = map[p.id] || [];
        h += '<td>' + numInput(mapPath(i) + '.' + p.id + '.0', pr[0]) + '</td><td>' + numInput(mapPath(i) + '.' + p.id + '.1', pr[1]) + '</td>';
      });
      h += '<td class="del"><button type="button" class="btn danger small" data-del-tier="' + listName + '" data-i="' + i + '">ลบ</button></td></tr>';
    });
    return h + '</tbody>';
  }
  function renderSettings() {
    if (!D) return;
    $('paperList').innerHTML = D.papers.map(function (p, i) {
      return '<div class="paper-row"><input type="text" data-path="papers.' + i + '.name" data-kind="text" value="' + esc(p.name) + '" aria-label="ชื่อกระดาษ">' +
        '<button type="button" class="btn danger small" data-del-paper="' + i + '">ลบ</button></div>';
    }).join('') || '<div class="hint" style="margin-bottom:8px">ยังไม่มีกระดาษ</div>';
    $('bookTable').innerHTML = tierTable(D.bookTiers, 'bookTiers', 'ตั้งแต่<br>(แผ่น A3)', function (t) { return t.r; }, function (i) { return 'bookTiers.' + i + '.r'; });
    $('sheetTable').innerHTML = tierTable(D.sheetTiers, 'sheetTiers', 'ตั้งแต่<br>(ใบ)', function (t) { return t.r[sheetSize]; }, function (i) { return 'sheetTiers.' + i + '.r.' + sheetSize; });
    $('sheetSizeSeg').querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-val') === sheetSize); });
    document.querySelectorAll('#view-settings [data-set]').forEach(function (el) {
      var v = getPath(D, el.getAttribute('data-set')); el.value = v == null ? '' : v;
    });
    touch();
  }
  function getPath(o, path) { return path.split('.').reduce(function (x, k) { return x == null ? x : x[k]; }, o); }
  function setPath(o, path, v) {
    var ks = path.split('.'), last = ks.pop();
    var target = ks.reduce(function (x, k, idx) {
      if (x[k] == null) x[k] = /^\d+$/.test(ks[idx + 1] || last) ? [] : {};
      return x[k];
    }, o);
    target[last] = v;
  }
  function readInput(el) { return el.getAttribute('data-kind') === 'text' ? el.value : (el.value === '' ? '' : Number(el.value)); }

  $('view-settings').addEventListener('input', function (e) {
    var el = e.target, path = el.getAttribute('data-path') || el.getAttribute('data-set');
    if (!path || !D) return;
    setPath(D, path, readInput(el));
    if (/^papers\.\d+\.name$/.test(path)) { // อัปเดตหัวตารางตามชื่อกระดาษ
      $('bookTable').querySelectorAll('thead tr:first-child th[colspan]').forEach(function (th, i) { th.textContent = D.papers[i] ? D.papers[i].name : ''; });
      $('sheetTable').querySelectorAll('thead tr:first-child th[colspan]').forEach(function (th, i) { th.textContent = D.papers[i] ? D.papers[i].name : ''; });
    }
    touch();
  });

  // กดสองครั้งเพื่อยืนยัน (หน้าต่าง confirm ใช้ไม่ได้ในหน้าลิงก์)
  function confirmTap(btn, msg) {
    if (btn.dataset.armed) { delete btn.dataset.armed; return true; }
    btn.dataset.armed = '1'; var old = btn.textContent; btn.textContent = 'กดอีกครั้ง';
    toast(msg);
    setTimeout(function () { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
    return false;
  }
  $('view-settings').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !D) return;
    if (b.hasAttribute('data-del-paper')) {
      var i = +b.getAttribute('data-del-paper'), p = D.papers[i];
      if (!confirmTap(b, 'ลบ "' + p.name + '" และเรทของกระดาษนี้? กดอีกครั้งเพื่อยืนยัน')) return;
      D.papers.splice(i, 1);
      D.bookTiers.forEach(function (t) { delete t.r[p.id]; });
      D.sheetTiers.forEach(function (t) { SIZES.forEach(function (z) { delete t.r[z][p.id]; }); });
      renderSettings();
    } else if (b.hasAttribute('data-del-tier')) {
      var list = b.getAttribute('data-del-tier');
      if (!confirmTap(b, 'ลบช่วงนี้? กดอีกครั้งเพื่อยืนยัน')) return;
      D[list].splice(+b.getAttribute('data-i'), 1); renderSettings();
    } else if (b.parentNode && b.parentNode.id === 'sheetSizeSeg') {
      sheetSize = b.getAttribute('data-val'); renderSettings();
    }
  });
  $('btnAddPaper').addEventListener('click', function () {
    D.papers.push({ id: 'p' + Date.now().toString(36), name: 'กระดาษใหม่' }); renderSettings();
    var inputs = $('paperList').querySelectorAll('input'); var last = inputs[inputs.length - 1];
    if (last) { last.focus(); last.select(); }
  });
  function addTier(list, mk) {
    var max = D[list].reduce(function (m, t) { return Math.max(m, val(t.min) || 0); }, 0);
    D[list].push(mk(max ? max * 2 : 1)); renderSettings();
  }
  $('btnAddBookTier').addEventListener('click', function () { addTier('bookTiers', function (m) { return { min: m, r: {} }; }); });
  $('btnAddSheetTier').addEventListener('click', function () { addTier('sheetTiers', function (m) { return { min: m, r: { A4: {}, A5: {}, A6: {} } }; }); });
  $('btnDiscard').addEventListener('click', function () {
    if (!confirmTap(this, 'ยกเลิกการแก้ไขทั้งหมด? กดอีกครั้งเพื่อยืนยัน')) return;
    D = clone(R); writeJSON(DRAFT_KEY, null); renderSettings();
  });

  // สร้างหน้าเว็บทั้งหน้าใหม่จากต้นฉบับ + เรทชุดใหม่ แล้วเผยแพร่
  function buildPage(rates) {
    var json = JSON.stringify(rates).replace(/</g, '\\u003c');
    var reset = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}' +
      'html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}' +
      'img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
    var head = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">\n';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      '<title>ราคากลางงานพิมพ์</title>\n' + head +
      '<style id="app-style">' + $('app-style').textContent + '</style>\n' +
      '<template id="app-markup">' + $('app-markup').innerHTML + '</template>\n<div id="app"></div>\n' +
      '<script type="application/json" id="rates-data">' + json + '<\/script>\n' +
      '<script id="app-script">' + $('app-script').textContent + '<\/script>\n</body></html>';
  }
  $('btnSave').addEventListener('click', function () {
    if (!artifactApi || !isDirty()) return;
    var next = clone(D);
    next.bookTiers = sortedTiers(next.bookTiers); next.sheetTiers = sortedTiers(next.sheetTiers);
    next.updatedAt = new Date().toISOString();
    var btn = this; btn.disabled = true; $('saveMsg').textContent = 'กำลังบันทึก…';
    artifactApi.publish(buildPage(next)).then(function () {
      writeJSON(DRAFT_KEY, null);
      $('saveMsg').textContent = 'บันทึกแล้ว กำลังโหลดหน้าใหม่…';
    }, function (err) {
      var code = err && err.code;
      if (code === 'conflict') { $('saveMsg').textContent = 'มีการบันทึกจากที่อื่นก่อน — กำลังโหลดเรทล่าสุด'; return; }
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required') {
        $('saveMsg').textContent = 'บัญชีนี้ไม่มีสิทธิ์แก้เรท'; return;
      }
      $('saveMsg').textContent = code === 'rate_limited' ? 'บันทึกถี่เกินไป รอสักครู่แล้วกดใหม่' : 'บันทึกไม่สำเร็จ ลองกดบันทึกอีกครั้ง';
      btn.disabled = false;
    });
  });

  // ---------- เริ่มต้น ----------
  $('shopLabel').textContent = R.shopName || '';
  render();

  // เปิดแท็บตั้งค่าเฉพาะคนที่แก้หน้าเว็บนี้ได้ (เจ้าของร้าน)
  if (window.claude && typeof window.claude.use === 'function') {
    Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function (res) {
      var api = res[0], user = res[1];
      if (!api || !user) return null;
      return user.canEdit().then(function (ok) { return ok ? api : null; });
    }).then(function (api) {
      if (!api) return;
      artifactApi = api;
      var saved = readJSON(DRAFT_KEY);
      D = saved && saved.base === (R.updatedAt || '') && saved.draft ? normalize(saved.draft) : clone(R);
      $('tabs').classList.remove('hidden');
    }).catch(function () { /* ไม่มีสิทธิ์แก้ = ใช้เป็นหน้าคำนวณอย่างเดียว */ });
  }
})();
</script>
<!--/APP-->
</body>
</html>
